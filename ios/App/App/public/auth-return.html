<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Returning to Starfall…</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <style>
    body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:radial-gradient(120% 80% at 50% -10%,#0b1640,#04060f 45%,#02030a 100%);color:#e8edf6;
      font:16px/1.6 "Segoe UI",system-ui,sans-serif;text-align:center;padding:24px}
    .spin{width:42px;height:42px;border:3px solid rgba(31,217,255,.25);border-top-color:#1fd9ff;border-radius:50%;
      animation:r 1s linear infinite}
    @keyframes r{to{transform:rotate(360deg)}}
    a.btn{display:inline-block;background:linear-gradient(180deg,#1fd9ff,#005577);color:#001018;font-weight:700;
      padding:14px 26px;border-radius:12px;text-decoration:none;letter-spacing:.08em}
    p{color:#9aa6b8;max-width:420px}
    .err{color:#ff8ba0}
  </style>
</head>
<body>
  <div class="spin" id="spin"></div>
  <h2 id="title">Signed in — returning to the app…</h2>
  <p id="hint">If nothing happens, tap the button below.</p>
  <a class="btn hidden" id="open" style="display:none" href="#">OPEN STARFALL</a>
  <script>
    // Native-app OAuth handoff: this page runs in the SYSTEM browser after
    // Google sign-in (the session cookie lives here). It mints a short-lived
    // one-time token and deep-links back into the app, which exchanges the
    // token for its own session. (Google forbids OAuth inside app WebViews.)
    (async () => {
      const title = document.getElementById('title');
      const open = document.getElementById('open');
      const spin = document.getElementById('spin');
      try {
        const res = await fetch('/api/auth/one-time-token/generate', { credentials: 'include' });
        if (!res.ok) throw new Error('no session');
        const { token } = await res.json();
        const link = 'starfall://auth?token=' + encodeURIComponent(token);
        open.href = link;
        open.style.display = 'inline-block';
        location.href = link; // trigger the app switch
        setTimeout(() => { spin.style.display = 'none'; }, 2500);
      } catch {
        spin.style.display = 'none';
        title.textContent = 'Sign-in didn\'t complete';
        title.className = 'err';
        document.getElementById('hint').textContent =
          'Please go back to the Starfall app and try again — or play in the browser at starfall.valentin.is.';
      }
    })();
  </script>
</body>
</html>
